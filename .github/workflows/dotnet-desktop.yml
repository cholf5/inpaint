# CI / 打包流水线
#
# 触发与行为：
#   - PR / push 到 main：只跑单元测试。
#   - tag v*：测试通过后打包 —— macOS .app（scripts/package-macos.sh，arm64+x64，
#     自包含、ad-hoc 签名）、Windows win-x64 自包含 zip + Inno Setup 安装包、Linux linux-x64 zip，
#     创建 GitHub Release 并上传产物。
#   - workflow_dispatch：手动触发打包（不建 Release，产物在本次 run 的 Artifacts 里），发版前试打包用。
#
# 版本约定：GitHub Release tag 带 v 前缀，数值必须等于 src/Inpaint.App 的 csproj <Version>
# （UpdateChecker 的比较基准），打 tag 前先改 csproj；tag 与 csproj 不一致时构建直接失败。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  APP_PROJECT: src/Inpaint.App/Inpaint.App.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      # csproj <Version>，供打包 job 命名产物；tag 触发时已在此校验与 tag 一致
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "$APP_PROJECT" | head -1 | tr -d '[:space:]')
          [ -n "$VERSION" ] || { echo "无法从 $APP_PROJECT 读取 <Version>" >&2; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG=${GITHUB_REF_NAME#v}
              [ "$TAG" = "$VERSION" ] || { echo "tag $GITHUB_REF_NAME 与 csproj <Version>$VERSION 不一致" >&2; exit 1; }
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: dotnet test Inpaint.slnx

  # 三个打包 job 只在 tag / 手动触发时跑；版本以 csproj <Version> 为单一来源，
  # 在 test job 统一读取并作为 output 传递，tag 时校验与 tag 一致（不一致在测试阶段就失败）。
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Package .app bundle
        run: scripts/package-macos.sh ${{ matrix.arch }}
      - name: Zip bundle
        run: ditto -c -k --keepParent artifacts/macos/Inpaint.app "Inpaint-${VERSION}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: Inpaint-*-macos-*.zip
          if-no-files-found: error

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish self-contained exe
        run: dotnet publish $env:APP_PROJECT -c Release -r win-x64 --self-contained true -o "Inpaint-${env:VERSION}-win-x64"
      - name: Zip publish folder
        shell: pwsh
        run: Compress-Archive -Path "Inpaint-${env:VERSION}-win-x64" -DestinationPath "Inpaint-${env:VERSION}-win-x64.zip"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build setup installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION scripts\Inpaint.iss
          # 挪到仓库根：artifact 必须扁平，否则 release job 的 gh release upload dist/*
          # 会遇到目录（upload-artifact 按多路径最小公共祖先保留结构）
          Move-Item artifacts/windows/Inpaint-*-win-x64-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: package-win-x64
          path: |
            Inpaint-*-win-x64.zip
            Inpaint-*-win-x64-setup.exe
          if-no-files-found: error

  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish self-contained binary
        run: dotnet publish $APP_PROJECT -c Release -r linux-x64 --self-contained true -o "Inpaint-${VERSION}-linux-x64"
      - name: Zip publish folder
        run: zip -r "Inpaint-${VERSION}-linux-x64.zip" "Inpaint-${VERSION}-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: Inpaint-*-linux-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
